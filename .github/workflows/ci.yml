name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.example }}
    # macos-26 defaults to Xcode 26.6 / Swift 6.3 with the iOS 26.5 SDK.
    # Xcode 27 images are public preview only — stay on stable Xcode 26.6.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example: [LabelProgrammatically, ButtonProgrammatically, ComponentsCatalog]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (Swift 6.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          xcodebuild build \
            -project "${{ matrix.example }}/${{ matrix.example }}.xcodeproj" \
            -scheme "${{ matrix.example }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Test ComponentsCatalog
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (Swift 6.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ComponentsCatalog/ComponentsCatalog.xcodeproj \
            -scheme ComponentsCatalog \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (Swift 6.3)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Check formatting
        run: swift format lint --recursive --strict LabelProgrammatically ButtonProgrammatically ComponentsCatalog
