name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.example }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        example: [LabelProgrammatically, ButtonProgrammatically, ComponentsCatalog]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          xcodebuild build \
            -project "${{ matrix.example }}/${{ matrix.example }}.xcodeproj" \
            -scheme "${{ matrix.example }}" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Test ComponentsCatalog
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          destination=$(xcodebuild -showdestinations -project ComponentsCatalog/ComponentsCatalog.xcodeproj -scheme ComponentsCatalog 2>/dev/null | awk -F'[ ,]' '/platform:iOS Simulator/ && /name:iPhone/ {print $0; exit}' | sed -n 's/.*id:\([^,}]*\).*/platform=iOS Simulator,id=\1/p')
          if [ -z "$destination" ]; then
            echo "No iPhone simulator found"
            xcodebuild -showdestinations -project ComponentsCatalog/ComponentsCatalog.xcodeproj -scheme ComponentsCatalog
            exit 1
          fi
          xcodebuild test \
            -project ComponentsCatalog/ComponentsCatalog.xcodeproj \
            -scheme ComponentsCatalog \
            -configuration Debug \
            -destination "$destination" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Check formatting
        run: swift format lint --recursive --strict LabelProgrammatically ButtonProgrammatically ComponentsCatalog
