<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">ComponentsCatalog  UIKit Catalog index</title>
  <desc id="desc">Layout mock of the searchable ComponentsCatalog index listing UIKit demos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="100%" stop-color="#E5E5EA"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="366" height="820" rx="32" fill="#F2F2F7"/>

  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#1C1C1E" font-weight="600">9:41</text>
  <text x="195" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" fill="#1C1C1E" font-weight="700">UIKit Catalog</text>

  <rect x="28" y="110" width="334" height="36" rx="10" fill="#E5E5EA"/>
  <text x="44" y="133" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#8E8E93">Filter components</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" filter="url(#soft)">
    <rect x="28" y="166" width="334" height="72" rx="14" fill="#FFFFFF"/>
    <text x="48" y="196" font-size="17" font-weight="600" fill="#1C1C1E">UILabel</text>
    <text x="48" y="218" font-size="13" fill="#8E8E93">Dynamic Type, attributed text and insets</text>

    <rect x="28" y="248" width="334" height="72" rx="14" fill="#FFFFFF"/>
    <text x="48" y="278" font-size="17" font-weight="600" fill="#1C1C1E">UIButton</text>
    <text x="48" y="300" font-size="13" fill="#8E8E93">Configuration, menus and async actions</text>

    <rect x="28" y="330" width="334" height="72" rx="14" fill="#FFFFFF"/>
    <text x="48" y="360" font-size="17" font-weight="600" fill="#1C1C1E">UISwitch</text>
    <text x="48" y="382" font-size="13" fill="#8E8E93">UIAction-driven toggles with live feedback</text>

    <rect x="28" y="412" width="334" height="72" rx="14" fill="#FFFFFF"/>
    <text x="48" y="442" font-size="17" font-weight="600" fill="#1C1C1E">UISlider</text>
    <text x="48" y="464" font-size="13" fill="#8E8E93">Continuous values with Dynamic Type labels</text>

    <rect x="28" y="494" width="334" height="72" rx="14" fill="#FFFFFF"/>
    <text x="48" y="524" font-size="17" font-weight="600" fill="#1C1C1E">UISegmentedControl</text>
    <text x="48" y="546" font-size="13" fill="#8E8E93">Single selection with SF Symbol segments</text>

    <rect x="28" y="576" width="334" height="72" rx="14" fill="#FFFFFF"/>
    <text x="48" y="606" font-size="17" font-weight="600" fill="#1C1C1E">UIProgressView</text>
    <text x="48" y="628" font-size="13" fill="#8E8E93">Determinate progress driven from code</text>
  </g>

  <text x="195" y="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8E8E93">Layout mock · replace with a simulator PNG when available</text>
  <rect x="140" y="812" width="110" height="5" rx="2.5" fill="#1C1C1E" opacity="0.25"/>
</svg>
