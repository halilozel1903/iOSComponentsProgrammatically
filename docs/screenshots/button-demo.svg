<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">ButtonProgrammatically  configuration and accent menu</title>
  <desc id="desc">Layout mock of the ButtonProgrammatically sample with a filled action button and accent color control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F2F7"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="366" height="820" rx="32" fill="#FFFFFF"/>

  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#1C1C1E" font-weight="600">9:41</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" filter="url(#soft)">
    <rect x="70" y="320" width="250" height="72" rx="18" fill="#5856D6"/>
    <text x="195" y="352" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Tap Me</text>
    <text x="195" y="376" text-anchor="middle" font-size="13" fill="#E5E5FF">Programmatic UIButton</text>

    <rect x="100" y="420" width="190" height="48" rx="24" fill="#EDEDFC"/>
    <text x="195" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#5856D6">Accent color</text>
  </g>

  <text x="195" y="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8E8E93">Layout mock · replace with a simulator PNG when available</text>
  <rect x="140" y="812" width="110" height="5" rx="2.5" fill="#1C1C1E" opacity="0.25"/>
</svg>
